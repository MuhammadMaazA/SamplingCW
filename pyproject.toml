[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlink"
version = "0.1.0"
description = "Mirror-based optical communication experiments for COMP0228"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
gridlink = "gridlink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

